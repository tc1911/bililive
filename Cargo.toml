[package]
name = "bililive"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
flate2 = "1.1.10"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
libc = "0.2.190"
md-5 = "0.11.0"
qrcode = "0.14.1"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "cookies", "gzip", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.6"
url = "2.5.8"
